[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "participant-bench"
version = "0.1.0"
description = "Lokale, nachvollziehbare Evaluation strukturierter Teilnehmerlisten"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3", "pyyaml>=6,<7", "pymupdf>=1.26,<1.27",
  "pillow>=11,<12", "pytesseract>=0.3.13,<0.4", "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5", "psutil>=7,<8", "scipy>=1.15,<2",
  "huggingface-hub>=0.34,<1",
]

[project.optional-dependencies]
models = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.6", "accelerate>=1.10,<2", "safetensors>=0.6,<1"]

[project.scripts]
participant-bench = "participant_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv]
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

