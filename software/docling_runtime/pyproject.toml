[project]
name = "participant-docling-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["docling==2.143.1", "torch==2.8.0", "torchvision==0.23.0", "Pillow>=11,<12"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
