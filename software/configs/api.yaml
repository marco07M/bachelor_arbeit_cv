# Generic Chat-Completions-compatible API with bearer API key, no local weights required.
extends: local.yaml
methods: [ocr_rules, ocr_llm, vlm]
signature:
  backend: vlm
models:
  ocr_llm:
    backend: api
    max_new_tokens: 4096
    api:
      base_url_env: LLM_API_BASE_URL
      model_env: LLM_API_MODEL
      api_key_env: LLM_API_KEY
  vlm:
    backend: api
    max_new_tokens: 8192
    api:
      base_url_env: VLM_API_BASE_URL
      model_env: VLM_API_MODEL
      api_key_env: VLM_API_KEY
