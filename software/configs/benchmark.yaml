methods:
- ocr_raw
- ocr_llm
- paddle_llm
- docling
- vlm
- ocr_vlm
seed: 42
output_dir: runs
cache_dir: .cache/participant-bench
cache_max_gb: 2
pdf:
  dpi: 220
  recursive: true
  auto_orient: true
  osd_min_confidence: 5
ocr:
  command: auto
  languages: deu+eng
  psm: 6
  timeout_seconds: 120
  remove_grid_lines: true
rules:
  header_aliases:
    row_ref:
    - nr
    - nummer
    - lfd
    first_name:
    - vorname
    - vornamen
    - firstname
    last_name:
    - nachname
    - familienname
    - zuname
    - lastname
    - surname
    personnel_number:
    - personalnummer
    - personalnr
    - persnr
    - mitarbeiternummer
    department:
    - abteilung
    - department
    - bereich
    - kurzzeichen
    - kuerzel
    - kürzel
    - organization
    - organisation
    signature:
    - unterschrift
    - signature
  columns: {}
  body_top: null
  body_bottom: 0.96
  row_tolerance: 0.008
signature:
  backend: opencv
  inspect_known: true
  context_height: 0.12
  row_padding: 0.008
  max_row_height: 0.18
  max_new_tokens: 192
  blank_ink_fraction: 0.0005
  component_min_area: 8
models:
  ocr_llm:
    repo: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    path: models/qwen3-4b-instruct-2507
    dtype: bfloat16
    quantization: none
    attention: sdpa_repeated_kv
    device: cuda
    gpu_memory_gib: 9
    cpu_memory_gib: 32
    max_input_tokens: 12000
    prefill_chunk_size: 1024
    max_new_tokens: 8192
    do_sample: false
    temperature: 0.7
    warmup: true
    preserve_partial_fields: true
  vlm:
    repo: Qwen/Qwen3-VL-4B-Instruct
    attention: sdpa_repeated_kv
    revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
    path: models/qwen3-vl-4b
    dtype: bfloat16
    device: cuda
    gpu_memory_gib: 10
    cpu_memory_gib: 32
    max_input_tokens: 12000
    max_new_tokens: 8192
    do_sample: false
    temperature: 0.7
    min_pixels: 65536
    max_pixels: 1048576
    tile_height: null
    tile_overlap: 0
    warmup: true
costs:
  kind: scenario
  volume: null
  hourly_rate_eur: null
  manual_minutes_per_page: null
  review_minutes_per_page: null
  local_operating_eur_per_page: null
  development_hours: null
  energy_kwh_per_page: null
  energy_basis: null
  electricity_eur_per_kwh: null
main_comparison: true
structures:
  paddle_llm:
    models_dir: models/paddle-structure
    extraction: llm
    device: cuda
    timeout_seconds: 600
    # Positioned input is opt-in: the development comparison showed a regression.
    assignment_format: legacy_v13
  docling:
    models_dir: models/docling
    extraction: table
    device: cuda
    table_mode: accurate
    # Development comparison 2026-11-02: matching off retained explicit empty cells.
    do_cell_matching: false
    mapping: structured
    organization_header_aliases: &organization_headers
    - Organization
    - Organisation
    - Abteilung
    - Organisationseinheit
    - Org.-Einheit
    - Org.
    - Bereich
    - Department
    - Organizational Unit
    - Organisational Unit
    - Kurzzeichen
    - Kürzel
    - Kuerzel
    - Org Unit
    force_full_page_ocr: false
    ocr_scale: 3.0
    scan_input: rendered
    timeout_seconds: 600
