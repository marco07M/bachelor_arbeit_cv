methods: [ocr_rules, ocr_llm, vlm]
seed: 42
output_dir: runs
cache_dir: .cache/participant-bench
cache_max_gb: 2
pdf:
  dpi: 220
  recursive: false
  auto_orient: true
  osd_min_confidence: 5
ocr:
  command: auto
  languages: deu+eng
  psm: 6
  timeout_seconds: 120
  remove_grid_lines: true
rules:
  header_aliases:
    row_ref: [nr, nummer, lfd]
    first_name: [vorname, firstname]
    last_name: [nachname, familienname, lastname]
    personnel_number: [personalnummer, personalnr, persnr]
    department: [abteilung, department, bereich]
    signature: [unterschrift, signature]
  # Optional normalized column intervals, e.g. first_name: [0.10, 0.29].
  columns: {}
  body_top: null
  body_bottom: 0.96
  row_tolerance: 0.008
signature:
  blank_ink_fraction: 0.0005
  component_min_area: 8
  # Ink remains unknown: no validated positive classifier for real signatures.
models:
  ocr_llm:
    repo: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    path: models/qwen3-8b
    dtype: bfloat16
    device: auto
    gpu_memory_gib: 10
    cpu_memory_gib: 32
    max_input_tokens: 12000
    max_new_tokens: 2048
    do_sample: false
    temperature: 0.7
    warmup: true
  vlm:
    repo: Qwen/Qwen3-VL-4B-Instruct
    revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
    path: models/qwen3-vl-4b
    dtype: bfloat16
    device: auto
    gpu_memory_gib: 10
    cpu_memory_gib: 32
    max_input_tokens: 12000
    max_new_tokens: 2048
    do_sample: false
    temperature: 0.7
    min_pixels: 65536
    max_pixels: 1048576
    tile_height: null
    tile_overlap: 0
    warmup: true
costs:
  kind: scenario
  volume: null
  hourly_rate_eur: null
  manual_minutes_per_page: null
  review_minutes_per_page: null
  local_operating_eur_per_page: null
  development_hours: null
  energy_kwh_per_page: null
  energy_basis: null
  electricity_eur_per_kwh: null
