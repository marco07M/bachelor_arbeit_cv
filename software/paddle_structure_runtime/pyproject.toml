[project]
name = "participant-paddle-structure-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["paddleocr[doc-parser]==3.7.0", "paddlex==3.7.2", "paddlepaddle-gpu==3.3.1", "Pillow>=11,<12", "PyYAML>=6,<7"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }
